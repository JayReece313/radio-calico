server {
    listen 80;
    listen [::]:80;
    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' *.mzstatic.com; connect-src 'self' d3d4yli4hf5bmh.cloudfront.net itunes.apple.com; media-src 'self' d3d4yli4hf5bmh.cloudfront.net blob:; worker-src blob:; object-src 'none';" always;

    # Proxy all API requests to the Express app
    location /api/ {
        proxy_pass         http://app:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve static files; fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
